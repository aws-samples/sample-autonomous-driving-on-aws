<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOTIF Scenario Generation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
         background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #e8eaed; min-height: 100vh; padding: 28px 20px; }
  .wrap { max-width: 1500px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 28px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header a { color: #667eea; text-decoration: none; font-size: 14px; border: 1px solid rgba(102,126,234,.3); padding: 6px 14px; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 14px; color: #9aa0a6; font-weight: 600; margin: 4px 0 10px; }
  textarea { width: 100%; min-height: 96px; background: #0d1220; color: #e8eaed; border: 1px solid #2c3550; border-radius: 8px; padding: 11px; font: inherit; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: rgba(102,126,234,.12); color: #b8c1ff; cursor: pointer; border: 0; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  select, button.go { background: #0d1220; color: #e8eaed; border: 1px solid #2c3550; border-radius: 8px; padding: 9px 12px; font: inherit; }
  button.go { background: linear-gradient(135deg, #667eea, #764ba2); border: 0; font-weight: 600; cursor: pointer; flex: 1; }
  button.go:disabled { opacity: .5; cursor: wait; }
  .reply { margin-top: 12px; white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; color: #cfd6e4; }
  .reply.err { color: #ff8a80; }
  .recent div { padding: 6px 8px; border-radius: 6px; cursor: pointer; color: #9aa0a6; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .recent div:hover { background: rgba(255,255,255,.05); color: #e8eaed; }
  .recent div span:last-child { white-space: nowrap; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: #9aa0a6; margin-bottom: 14px; }
  .meta b { color: #e8eaed; font-weight: 600; }
  .clock { font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; color: #e8eaed; }
  /* stepper */
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
  .step { background: #0d1220; border: 1px solid #222a40; border-radius: 10px; padding: 10px; cursor: pointer; position: relative; min-height: 78px; }
  .step.sel { border-color: #667eea; box-shadow: 0 0 0 1px #667eea inset; }
  .step .n { font-size: 11px; color: #6f7a90; }
  .step .t { font-size: 13px; font-weight: 600; margin: 3px 0 6px; }
  .step .s { font-size: 12px; color: #9aa0a6; display: flex; justify-content: space-between; }
  .step .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 0 0 10px 10px; background: #222a40; }
  .step.running .bar { background: repeating-linear-gradient(45deg, #667eea 0 8px, #8a9bf5 8px 16px); background-size: 22px 22px; animation: move 1s linear infinite; }
  .step.done .bar { background: #34c38f; } .step.failed .bar { background: #ff6b6b; } .step.partial .bar { background: linear-gradient(90deg, #34c38f var(--p,0%), #667eea var(--p,0%)); }
  @keyframes move { to { background-position: 22px 0; } }
  @media (max-width: 900px) { .steps { grid-template-columns: repeat(3, 1fr); } }
  .detail { background: #0d1220; border: 1px solid #222a40; border-radius: 10px; padding: 14px; font-size: 13px; min-height: 120px; overflow-x: auto; }
  .detail h3 { font-size: 14px; margin-bottom: 8px; }
  .detail p.sub { color: #9aa0a6; margin-bottom: 10px; line-height: 1.55; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1d2438; vertical-align: top; }
  th { color: #8790a6; font-weight: 600; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #c3cdf5; }
  pre { white-space: pre-wrap; background: #090d18; padding: 8px; border-radius: 6px; margin-top: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tags span { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(255,255,255,.06); color: #b9c0cf; }
  .tags span b { color: #8a9bf5; font-weight: 600; margin-left: 3px; }
  .label-critical { color: #ff8a80 !important; } .label-interaction { color: #ffd166 !important; } .label-nominal-yield { color: #7ee2b8 !important; } .label-no-interaction { color: #8790a6 !important; }
  .state { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: #1d2438; color: #9aa0a6; }
  .state.succeeded { background: rgba(52,195,143,.15); color: #7ee2b8; } .state.running, .state.submitted { background: rgba(102,126,234,.18); color: #b8c1ff; } .state.failed { background: rgba(255,107,107,.15); color: #ff8a80; }
  /* gantt */
  .gantt { margin: 12px 0 4px; }
  .lane { display: grid; grid-template-columns: 200px 1fr 60px; align-items: center; gap: 10px; height: 22px; font-size: 11.5px; }
  .lane .name { color: #8790a6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { position: relative; height: 9px; background: rgba(255,255,255,.04); border-radius: 5px; overflow: hidden; }
  .gbar { position: absolute; top: 0; bottom: 0; border-radius: 5px; transition: left .4s, width .4s; }
  .gbar.running { background: repeating-linear-gradient(45deg, #667eea 0 8px, #8a9bf5 8px 16px); background-size: 22px 22px; animation: move 1s linear infinite; }
  .gbar.submitted { background: rgba(102,126,234,.35); } .gbar.succeeded { background: #34c38f; } .gbar.failed { background: #ff6b6b; }
  .lane .dur { text-align: right; color: #8790a6; font-variant-numeric: tabular-nums; }
  /* variant cards */
  .cards { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 16px; }
  .card { background: #0d1220; border: 1px solid #222a40; border-radius: 10px; overflow: hidden; }
  .card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1d2438; flex-wrap: wrap; }
  .card .id { font-weight: 600; word-break: break-all; }
  .card .views { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 900px) { .card .views { grid-template-columns: 1fr; } }
  .view { position: relative; background: #05070d; aspect-ratio: 1280 / 704; display: flex; align-items: center; justify-content: center; color: #5f6b85; font-size: 13px; }
  .view canvas, .view video { width: 100%; height: 100%; display: block; }
  .view .cap { position: absolute; left: 8px; top: 6px; font-size: 11px; color: #9aa0a6; background: rgba(5,7,13,.7); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
  .card .body { padding: 10px 14px; font-size: 12.5px; color: #9aa0a6; line-height: 1.55; }
  .judge { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; } .judge b { color: #e8eaed; }
  .judge a.osc { margin-left: auto; color: #8ab4f8; text-decoration: none; } .judge a.osc:hover { text-decoration: underline; }
  .pub { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .pub button { background: rgba(102,126,234,.15); color: #b8c1ff; border: 1px solid rgba(102,126,234,.4); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .pub button.quiet { background: none; border-color: #2c3550; color: #8790a6; }
  .pub a { color: #7ee2b8; text-decoration: none; }
  .note { font-size: 12px; color: #6f7a90; margin-top: 14px; line-height: 1.6; }
  .empty { color: #6f7a90; font-size: 14px; padding: 36px 0; text-align: center; }
  .links { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="title"></h1>
    <div class="links"><a id="langSwitch" href="#"></a><a id="galleryLink" href="gallery.html" data-i18n="gallery"></a></div>
  </header>
  <div class="grid">
    <section class="panel">
      <h2 data-i18n="request"></h2>
      <textarea id="prompt"></textarea>
      <div class="chips" id="examples"></div>
      <div class="row">
        <select id="count"><option>3</option><option selected>5</option><option>8</option><option>10</option></select>
        <button class="go" id="go" data-i18n="run"></button>
      </div>
      <div class="reply" id="reply"></div>
      <h2 style="margin-top:16px" data-i18n="recent"></h2>
      <div class="recent" id="recent"></div>
    </section>
    <section class="panel">
      <div id="batch"><div class="empty" data-i18n="emptyBatch"></div></div>
      <p class="note" data-i18n="note"></p>
    </section>
  </div>
</div>
<script>

async function api(path, options) {
  const res = await fetch(API + path, { headers: { 'content-type': 'application/json' }, ...options });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.detail || res.statusText), { status: res.status });
  return body;
}

$('go').onclick = async () => {
  const message = $('prompt').value.trim();
  if (!message) return;
  const n = Number($('count').value);
  $('go').disabled = true; $('reply').className = 'reply'; $('reply').textContent = L.thinking;
  agentRun = { prompt: message, startedAt: Date.now() / 1000, trace: null };
  try {
    let batchId;
    try {
      const out = await api('/chat', { method: 'POST', body: JSON.stringify({ message: `${message}\n${L.variantsSuffix(n)}`, sessionId, lang: LANG }) });
      sessionId = out.sessionId; batchId = out.batchId;
      Object.assign(agentRun, { finishedAt: Date.now() / 1000, trace: out.trace || [], text: out.text || out.error || '' });
      $('reply').textContent = agentRun.text;
    } catch (e) {
      if (e.status !== 503) throw e;
      const out = await api('/batches', { method: 'POST', body: JSON.stringify({ n, focus: message, autoRun: true, lang: LANG }) });
      batchId = out.batchId;
      Object.assign(agentRun, { finishedAt: Date.now() / 1000, trace: [], direct: true });
      $('reply').textContent = L.direct(batchId);
    }
    if (batchId) { agentRun.batchId = batchId; open(batchId); }

  } catch (e) {

};

function open(batchId) {
  current = batchId; data = null; selectedStep = null;
  Object.keys(cards).forEach((k) => delete cards[k]);
  $('batch').innerHTML = `<div class="empty">${esc(L.loading)}</div>`;
  clearInterval(pollTimer); clearInterval(clockTimer);
  poll(); pollTimer = setInterval(poll, 3000);
  clockTimer = setInterval(() => data && renderHeader(), 250);
}

async function poll() {
  if (!current) return;
  try {
    const d = await api(`/batches/${encodeURIComponent(current)}`);
    if (d.batchId !== current) return;
    data = d; render();
    if (d.done) { clearInterval(pollTimer); setTimeout(() => clearInterval(clockTimer), 500); loadRecent(); }
  } catch (e) { /* keep polling through transient errors */ }
}

/* ---------- step states ---------- */
function stageStatus(name) { return (data.timeline.find((t) => t.stage === name)) || null; }
function stepInfo(key) {
  const t = (s) => s && s.state;
  if (key === 'agent') {
    if (!agentRun || agentRun.batchId !== data.batchId) return { state: 'done', note: L.otherSession };
    return { state: agentRun.finishedAt ? 'done' : 'running', dur: agentRun.finishedAt ? agentRun.finishedAt - agentRun.startedAt : null,
             note: agentRun.direct ? L.directRun : L.tools((agentRun.trace || []).length) };
  }
  const g = stageStatus('generate');
  if (key === 'ontology') {
    const o = data.generation && data.generation.ontology;
    if (o) return { state: 'done', note: `${o.source === 'neptune' ? 'Neptune' : L.snapshot} · ${L.classes(Object.keys(o.classes).length)}` };
    // Batches made before the generator recorded the ontology slice: done once generation is done.
    return { state: t(g) === 'succeeded' ? 'done' : t(g) === 'failed' ? 'failed' : g ? 'running' : 'waiting', note: t(g) === 'succeeded' ? L.noRecord : '' };
  }
  if (key === 'hdmap') {
    const runs = data.timeline.filter((x) => x.stage.startsWith('hdmap-'));
    if (!runs.length) return { state: 'waiting' };
    const done = runs.filter((x) => x.state === 'succeeded').length, failed = runs.some((x) => x.state === 'failed');
    const start = Math.min(...runs.map((x) => x.startedAt || x.submittedAt || Infinity));
    const end = done === runs.length ? Math.max(...runs.map((x) => x.finishedAt || 0)) : null;
    return { state: done === runs.length ? 'done' : failed ? 'failed' : 'partial', progress: done / runs.length,
             dur: end && isFinite(start) ? end - start : null, note: L.videos(done, runs.length) };
  }
  const s = stageStatus(key);
  if (!s) return { state: 'waiting' };
  const map = { succeeded: 'done', failed: 'failed', running: 'running', submitted: 'running' };
  return { state: map[s.state] || 'waiting', dur: s.startedAt && s.finishedAt ? s.finishedAt - s.startedAt : null,
           note: s.state === 'submitted' ? L.queued : '' };
}
function activeStep() {
  const order = STEP_KEYS.map((k) => [k, stepInfo(k).state]);
  const running = order.find(([, st]) => st === 'running' || st === 'partial' || st === 'failed');
  if (running) return running[0];
  const lastDone = [...order].reverse().find(([, st]) => st === 'done');
  return lastDone ? lastDone[0] : 'agent';
}

function renderPublish(box, v) {

/* ---------- top-down SUMO view ---------- */
const VIEW = { x0: 170, x1: 230 };   // metres around the crossing (x=200); one scale for x and y so boxes keep their shape
function tick(c, ts) {
  if (!document.body.contains(c.el)) return;
  const dt = c.lastTs ? (ts - c.lastTs) / 1000 : 0; c.lastTs = ts;
  if (c.tel) {
    const frames = c.tel.frames, end = frames[frames.length - 1].t;
    if (c.video && !c.video.paused && c.window) c.simT = c.window[0] + c.video.currentTime;   // follow the HDMap video
    else { c.simT += dt * 1.5; if (c.simT > end) c.simT = frames[0].t; }
    draw(c);
  }

}
function draw(c) {
  const cv = c.el.querySelector('canvas'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const sx = W / (VIEW.x1 - VIEW.x0), sy = sx, yTop = H / sy / 2;
  const X = (x) => (x - VIEW.x0) * sx, Y = (y) => (yTop - y) * sy;

  g.fillStyle = '#151b27'; g.fillRect(0, Y(7), W, Y(-7) - Y(7));                                          // carriageway
  g.strokeStyle = '#d9b44a'; g.lineWidth = 2; g.setLineDash([]); g.beginPath(); g.moveTo(0, Y(0.12)); g.lineTo(W, Y(0.12)); g.moveTo(0, Y(-0.12)); g.lineTo(W, Y(-0.12)); g.stroke();
  g.strokeStyle = '#8b93a7'; g.lineWidth = 1.5; g.setLineDash([12, 12]); g.beginPath(); g.moveTo(0, Y(3.5)); g.lineTo(W, Y(3.5)); g.moveTo(0, Y(-3.5)); g.lineTo(W, Y(-3.5)); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#e8eaed'; for (let y = -7; y < 7; y += 1) g.fillRect(X(198.25), Y(y + 0.5), X(201.75) - X(198.25), Y(y) - Y(y + 0.5));  // zebra
  const frames = c.tel.frames, step = c.tel.stepS, i = Math.max(0, Math.min(frames.length - 1, Math.round((c.simT - frames[0].t) / step)));
  const f = frames[i];
  const box = (x, y, h, l, w, fill) => { g.save(); g.translate(X(x), Y(y)); g.rotate(-h * Math.PI / 180); g.fillStyle = fill; g.fillRect(-l / 2 * sx, -w / 2 * sy, l * sx, w * sy); g.restore(); };
  f.actors.forEach(([id, type, sub, x, y, h, l, w]) => {
    if (type === 'pedestrian') { g.fillStyle = '#ff6b6b'; g.beginPath(); g.arc(X(x), Y(y), Math.max(4, 0.5 * sx), 0, 7); g.fill(); }
    else box(x, y, h, l || 4.8, w || 1.8, sub === 'parked' ? '#4a5268' : '#d0a35a');
  });
  if (f.ego) {
    const [x, y, h, v] = f.ego;
    if (x < VIEW.x0) {
      const label = L.approaching(Math.round(200 - x), kmh(v));
      g.font = '13px sans-serif'; g.fillStyle = 'rgba(5,7,13,.8)'; g.fillRect(6, Y(-5.25) - 12, g.measureText(label).width + 10, 18);
      g.fillStyle = '#8a9bf5'; g.fillText(label, 11, Y(-5.25) + 2);
    }
    else box(x, y, h, 4.8, 1.8, '#667eea');
  }
  const inWin = c.window && c.simT >= c.window[0] && c.simT <= c.window[1];
  g.fillStyle = 'rgba(5,7,13,.75)'; g.fillRect(W - 250, H - 26, 246, 22);
  g.fillStyle = '#cfd6e4'; g.font = '12px sans-serif';
  g.fillText(`t = ${f.t.toFixed(1)} s · ${L.ego} ${f.ego ? kmh(f.ego[3]) : '–'}${inWin ? L.hdWindow : ''}`, W - 242, H - 10);
}

async function loadRecent() {
  try {
    const { batches } = await api('/batches');
    $('recent').innerHTML = batches.slice(0, 10).map((b) =>
      `<div data-id="${esc(b.batchId)}"><span>${esc(b.focus || b.batchId)}</span><span>${b.done ? (b.error ? L.recentFailed : L.recentDone) : L.recentRunning}</span></div>`).join('');
    $('recent').querySelectorAll('div[data-id]').forEach((el) => { el.onclick = () => open(el.dataset.id); });
  } catch (e) { $('recent').textContent = L.apiDown; }
}
loadRecent();
const fromUrl = params.get('batch');
if (fromUrl) open(fromUrl);
</script>
