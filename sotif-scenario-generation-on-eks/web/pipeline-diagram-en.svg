<svg viewBox="0 0 1520 650" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width:100%; height:auto;">
    <defs>
        <linearGradient id="awsOrange" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EC7211;stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <polygon points="0 0, 10 5, 0 10" fill="#FF9900" />
        </marker>
        <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1520" height="650" fill="#0a0e17"/>

    <!-- Outer Box for 5 stages -->
    <rect x="20" y="55" width="1490" height="270" rx="12" fill="none" stroke="#667eea" stroke-width="2" opacity="0.4" stroke-dasharray="8,4"/>

    <!-- Title -->
    <text x="760" y="35" text-anchor="middle" fill="#e8eaed" font-size="24" font-weight="600">
        5-Stage Pipeline + AWS Reference Architecture
    </text>

    <!-- ========== STAGE 1: Neptune ========== -->
    <g id="stage1" style="cursor:pointer">
        <rect x="40" y="70" width="200" height="240" rx="8" fill="rgba(26, 31, 46, 0.8)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <circle cx="70" cy="85" r="18" fill="url(#awsOrange)"/>
        <text x="70" y="92" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text>
        <text x="140" y="110" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">Ontology</text>
        <text x="140" y="130" text-anchor="middle" fill="#9aa0a6" font-size="13">SOTIF · CC BY papers</text>
        <image href="aws-icons/Arch_Amazon-Neptune_64.svg" x="108" y="145" width="64" height="64"/>
        <text x="140" y="225" text-anchor="middle" fill="#e8eaed" font-size="14" font-weight="600">Amazon Neptune</text>
        <rect x="60" y="245" width="160" height="50" rx="6" fill="#C925D1" opacity="0.2"/>
        <text x="140" y="268" text-anchor="middle" fill="#C925D1" font-size="18" font-weight="700">135</text>
        <text x="140" y="286" text-anchor="middle" fill="#9aa0a6" font-size="12">instances · 23 classes</text>
    </g>

    <!-- Arrow 1→2 -->
    <text x="295" y="175" text-anchor="middle" fill="#FF9900" font-size="10" font-weight="600">SPARQL</text>
    <line x1="260" y1="190" x2="330" y2="190" stroke="#FF9900" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- ========== STAGE 2: Bedrock ========== -->
    <g id="stage2" style="cursor:pointer">
        <rect x="350" y="70" width="200" height="240" rx="8" fill="rgba(26, 31, 46, 0.8)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <circle cx="380" cy="85" r="18" fill="url(#awsOrange)"/>
        <text x="380" y="92" text-anchor="middle" fill="white" font-size="16" font-weight="700">2</text>
        <text x="450" y="110" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">AgentCore</text>
        <text x="450" y="130" text-anchor="middle" fill="#9aa0a6" font-size="13">AI Generation</text>
        <image href="aws-icons/Arch_Amazon-Bedrock_64.svg" x="418" y="145" width="64" height="64"/>
        <text x="450" y="225" text-anchor="middle" fill="#e8eaed" font-size="14" font-weight="600">Amazon Bedrock</text>
        <rect x="370" y="245" width="160" height="50" rx="6" fill="#FF9900" opacity="0.2"/>
        <text x="450" y="268" text-anchor="middle" fill="#FF9900" font-size="18" font-weight="700">3–10</text>
        <text x="450" y="286" text-anchor="middle" fill="#9aa0a6" font-size="12">variants / request (Sonnet 5.5)</text>
    </g>

    <!-- Arrow 2→3 -->
    <text x="605" y="175" text-anchor="middle" fill="#FF9900" font-size="10" font-weight="600">Scenario Generation</text>
    <line x1="570" y1="190" x2="640" y2="190" stroke="#FF9900" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- ========== STAGE 3: SUMO ========== -->
    <g id="stage3" style="cursor:pointer">
        <rect x="660" y="70" width="200" height="240" rx="8" fill="rgba(26, 31, 46, 0.8)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <circle cx="690" cy="85" r="18" fill="url(#awsOrange)"/>
        <text x="690" y="92" text-anchor="middle" fill="white" font-size="16" font-weight="700">3</text>
        <text x="760" y="110" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">SUMO</text>
        <text x="760" y="130" text-anchor="middle" fill="#9aa0a6" font-size="13">Simulation</text>
        <image href="aws-icons/Arch_Amazon-EKS-Cloud_64.svg" x="728" y="145" width="64" height="64"/>
        <text x="760" y="225" text-anchor="middle" fill="#e8eaed" font-size="14" font-weight="600">EKS Job (Spot)</text>
        <rect x="680" y="245" width="160" height="50" rx="6" fill="#FF9900" opacity="0.2"/>
        <text x="760" y="268" text-anchor="middle" fill="#FF9900" font-size="18" font-weight="700">~5 s</text>
        <text x="760" y="286" text-anchor="middle" fill="#9aa0a6" font-size="12">physics check · TTC · distance</text>
    </g>

    <!-- Arrow 3→4 -->
    <text x="915" y="175" text-anchor="middle" fill="#FF9900" font-size="10" font-weight="600">TraCI Execution</text>
    <line x1="880" y1="190" x2="950" y2="190" stroke="#FF9900" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- ========== STAGE 4: RDS-HQ ========== -->
    <g id="stage4" style="cursor:pointer">
        <rect x="970" y="70" width="200" height="240" rx="8" fill="rgba(26, 31, 46, 0.8)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <circle cx="1000" cy="85" r="18" fill="url(#awsOrange)"/>
        <text x="1000" y="92" text-anchor="middle" fill="white" font-size="16" font-weight="700">4</text>
        <text x="1070" y="110" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">RDS-HQ</text>
        <text x="1070" y="130" text-anchor="middle" fill="#9aa0a6" font-size="13">Format Conversion</text>
        <image href="aws-icons/Arch_Amazon-EKS-Cloud_64.svg" x="1038" y="145" width="64" height="64"/>
        <text x="1070" y="225" text-anchor="middle" fill="#e8eaed" font-size="14" font-weight="600">EKS Job (Spot)</text>
        <rect x="990" y="245" width="160" height="50" rx="6" fill="#FF9900" opacity="0.2"/>
        <text x="1070" y="268" text-anchor="middle" fill="#FF9900" font-size="18" font-weight="700">~3 s</text>
        <text x="1070" y="286" text-anchor="middle" fill="#9aa0a6" font-size="12">.tar (WebDataset)</text>
    </g>

    <!-- Arrow 4→5 -->
    <text x="1240" y="175" text-anchor="middle" fill="#FF9900" font-size="10" font-weight="600">Coordinate Transform</text>
    <line x1="1190" y1="190" x2="1280" y2="190" stroke="#FF9900" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- ========== STAGE 5: Cosmos (200px로 통일) ========== -->
    <g id="stage5" style="cursor:pointer">
        <rect x="1300" y="70" width="200" height="240" rx="8" fill="rgba(26, 31, 46, 0.8)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <circle cx="1330" cy="85" r="18" fill="url(#awsOrange)"/>
        <text x="1330" y="92" text-anchor="middle" fill="white" font-size="16" font-weight="700">5</text>
        <text x="1400" y="110" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">HDMap</text>
        <text x="1400" y="130" text-anchor="middle" fill="#9aa0a6" font-size="13">Rendering</text>
        <image href="aws-icons/Arch_Amazon-EKS-Cloud_64.svg" x="1368" y="145" width="64" height="64"/>
        <text x="1400" y="225" text-anchor="middle" fill="#e8eaed" font-size="14" font-weight="600">EKS Job · CPU</text>
        <rect x="1320" y="245" width="160" height="50" rx="6" fill="#569A31" opacity="0.2"/>
        <text x="1400" y="268" text-anchor="middle" fill="#76D275" font-size="18" font-weight="700">~23 s</text>
        <text x="1400" y="286" text-anchor="middle" fill="#9aa0a6" font-size="12">per clip · 1280×704</text>
    </g>

    <!-- ========== Supporting Services ========== -->
    <line x1="40" y1="345" x2="1480" y2="345" stroke="#667eea" stroke-width="1" opacity="0.5"/>
    <text x="40" y="370" fill="#e8eaed" font-size="14" font-weight="700" text-transform="uppercase">Supporting Services</text>

    <!-- CloudFront -->
    <g>
        <rect x="100" y="395" width="120" height="120" rx="6" fill="rgba(26, 31, 46, 0.6)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <image href="aws-icons/Arch_Amazon-CloudFront_64.svg" x="128" y="415" width="64" height="64"/>
        <text x="160" y="495" text-anchor="middle" fill="#e8eaed" font-size="12" font-weight="600">CloudFront</text>
        <text x="160" y="509" text-anchor="middle" fill="#9aa0a6" font-size="10">Web Delivery</text>
    </g>

    <!-- ALB -->
    <g>
        <rect x="260" y="395" width="120" height="120" rx="6" fill="rgba(26, 31, 46, 0.6)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <image href="aws-icons/Arch_Elastic-Load-Balancing_64.svg" x="288" y="415" width="64" height="64"/>
        <text x="320" y="495" text-anchor="middle" fill="#e8eaed" font-size="12" font-weight="600">ALB</text>
        <text x="320" y="509" text-anchor="middle" fill="#9aa0a6" font-size="10">Load Balancing</text>
    </g>

    <!-- ECR -->
    <g>
        <rect x="420" y="395" width="120" height="120" rx="6" fill="rgba(26, 31, 46, 0.6)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <image href="aws-icons/Arch_Amazon-Elastic-Container-Registry_64.svg" x="448" y="415" width="64" height="64"/>
        <text x="480" y="495" text-anchor="middle" fill="#e8eaed" font-size="12" font-weight="600">ECR</text>
        <text x="480" y="509" text-anchor="middle" fill="#9aa0a6" font-size="10">Images</text>
    </g>

    <!-- S3 -->
    <g>
        <rect x="580" y="395" width="120" height="120" rx="6" fill="rgba(26, 31, 46, 0.6)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <image href="aws-icons/Arch_Amazon-Simple-Storage-Service_64.svg" x="608" y="415" width="64" height="64"/>
        <text x="640" y="495" text-anchor="middle" fill="#e8eaed" font-size="12" font-weight="600">S3</text>
        <text x="640" y="509" text-anchor="middle" fill="#9aa0a6" font-size="10">batch state · videos</text>
    </g>

    <!-- EKS -->
    <g>
        <rect x="740" y="395" width="120" height="120" rx="6" fill="rgba(26, 31, 46, 0.6)" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
        <image href="aws-icons/Arch_Amazon-EKS-Cloud_64.svg" x="768" y="415" width="64" height="64"/>
        <text x="800" y="495" text-anchor="middle" fill="#e8eaed" font-size="12" font-weight="600">EKS</text>
        <text x="800" y="509" text-anchor="middle" fill="#667eea" font-size="10">web · API · Jobs</text>
    </g>

    <!-- Connection lines -->
    <line x1="760" y1="310" x2="160" y2="395" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="760" y1="310" x2="320" y2="395" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="1070" y1="310" x2="480" y2="395" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="1400" y1="310" x2="640" y2="395" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <line x1="1070" y1="310" x2="800" y2="395" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

    <!-- Legend -->
    <rect x="40" y="545" width="1440" height="90" rx="8" fill="rgba(26, 31, 46, 0.8)" stroke="#FF9900" stroke-width="2"/>
    <text x="60" y="570" fill="#FF9900" font-size="13" font-weight="700">📊 Current implementation (CPU path)</text>
    <text x="60" y="590" fill="#e8eaed" font-size="11">
        Neptune SOTIF (135 instances) → AgentCore + Bedrock Sonnet 5.5 → SUMO check (EKS Spot Job) → RDS-HQ conversion (EKS Job) → Cosmos HDMap CPU render (EKS Job) · 87–112 s for 3 variants
    </text>
    <text x="60" y="610" fill="#667eea" font-size="13" font-weight="700">🚀 Next (GPU)</text>
    <text x="60" y="628" fill="#9aa0a6" font-size="11">
        g7e Spot (RTX PRO 6000 96GB) → Cosmos Transfer photoreal generation + resume after Spot interruption
    </text>
</svg>
