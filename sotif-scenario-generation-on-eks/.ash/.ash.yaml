      reason: Synthesized CloudFormation templates contain CDK asset hashes and S3 object keys, not secrets
    - rule_id: CKV_AWS_115
      path: "*Web.template.json"
      reason: CDK cross-region reference handler (Custom::CrossRegionExportReader/Writer), added during synthesis after aspects run; invoked synchronously by CloudFormation, so DLQ, reserved concurrency and VPC do not apply. These stacks have no other Lambda functions.
