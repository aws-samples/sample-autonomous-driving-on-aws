# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
# AWS Automated Security Helper settings for scripts/security_scan.sh. Code-level exceptions live next to the code
# (# nosec / # nosemgrep / # checkov:skip); infrastructure exceptions are in cdk/drive_atlas_infra/checks.py.
project_name: drive-atlas
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: web/media/**
      reason: Local-only demo videos, not part of the repository
  suppressions:
    - rule_id: SECRET-BASE64-HIGH-ENTROPY-STRING
      path: "*.template.json"
      reason: Synthesized CloudFormation templates contain CDK asset hashes and S3 object keys, not secrets
